<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Jobber · offline</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, sans-serif; background: #fff; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #f5f5f5; } p { color: #8e8e93; } }
  main { text-align: center; padding: 24px; }
  .mark { width: 48px; height: 48px; border-radius: 12px; background: #0b8f6c; color: #fff; display: inline-grid; place-items: center; font-weight: 700; font-size: 24px; }
  h1 { font-size: 26px; letter-spacing: -0.03em; margin: 20px 0 6px; }
  p { color: #8e8e93; margin: 0 0 24px; }
  button { height: 48px; padding: 0 24px; border-radius: 999px; border: 0; background: #111; color: #fff; font-size: 15px; font-weight: 600; }
  @media (prefers-color-scheme: dark) { button { background: #f5f5f5; color: #000; } }
</style>
</head>
<body>
<main>
  <span class="mark">J</span>
  <h1>You’re offline</h1>
  <p>Jobber needs a connection to load your matches.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
